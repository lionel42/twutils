[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "twutils"
version = "0.1.0.dev0"
description = "Utilities for TOFWERK GC-TOF-MS h5 files: reading, run check, peak extraction with peaxart"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENCE" }
authors = [
  { name = "Lionel Constantin", email = "lionel.constantin@empa.ch" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "h5py>=3.8",
  "peaxart",
  "masscal",  # the mass calibration (model, files); fitted by esper calibrate
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
twutils = "twutils.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/twutils"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "G"]

[tool.ruff.lint.isort]
known-first-party = ["twutils"]
known-third-party = ["conftest", "masscal"]
